services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar_local
      POSTGRES_DB: scholar_nexus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scholar_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar -d scholar_nexus"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  scholar_data:
